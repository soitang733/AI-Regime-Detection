name: Verify research pipeline
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-v2.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      # Use versioned raw data: no download, no moving train/validation boundaries.
      - run: python scripts/reproduce_v2.py
      - run: python -m src.research_v2.review
      - run: python -m src.research_v2.rolling_benchmarks
      # Rebuild ignored C2/C3/research artifacts required by the full legacy + V2 test suite.
      - run: python run_pipeline.py --steps models backtest
      - run: python -m src.models.diagnostics
      - run: python -m src.research.run
      - run: python -m pytest -q -p no:cacheprovider --junitxml=outputs/research_v2/acceptance_pytest_final.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            outputs/research_v2/reproduction/
            outputs/research_v2/review/*.csv
            outputs/research_v2/review/manifest.json
            outputs/research_v2/acceptance_pytest_final.xml
